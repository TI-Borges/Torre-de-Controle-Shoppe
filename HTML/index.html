<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Torre de Controle Shopee | AJBorges</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
          integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV"
          crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="pagina-painel carregando">

    <header class="topo">
        <div class="marca">
            <span class="marca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
            </span>
            <div>
                <strong>Torre de Controle</strong>
                <span>Shopee · AJBorges</span>
            </div>
        </div>

        <div id="atualizado" class="atualizado" role="status" aria-live="polite">Carregando…</div>

        <div class="topo-acoes">
            <button type="button" id="btn-tema" class="btn btn-icone" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <button type="button" id="btn-tv" class="btn" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                <span>Modo TV</span>
            </button>
            <span id="usuario-nome" class="usuario"></span>
            <button type="button" id="btn-sair" class="btn btn-sutil">Sair</button>
        </div>
    </header>

    <div id="aviso" class="aviso" role="alert" hidden></div>

    <main class="painel">
        <section id="kpis" class="kpis" aria-label="Indicadores (clique para filtrar)"></section>

        <section class="filtros" aria-label="Filtros">
            <div class="busca">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="busca" placeholder="Buscar placa, motorista, cidade ou SM" aria-label="Buscar placa, motorista, cidade ou SM" autocomplete="off">
            </div>
            <div id="filtros-ativos" class="filtros-ativos"></div>
            <span id="contagem" class="contagem"></span>
            <button type="button" id="btn-limpar" class="btn btn-sutil" hidden>Limpar filtros</button>
        </section>

        <section class="conteudo">
            <div class="cartao mapa-cartao">
                <div id="mapa" class="mapa" aria-label="Mapa dos veículos"></div>
                <div id="legenda" class="legenda"></div>
            </div>

            <div class="cartao tabela-cartao">
                <div id="tabela-rolagem" class="tabela-rolagem">
                    <table class="tabela" id="tabela">
                        <thead>
                            <tr>
                                <th data-col="placa" scope="col">Placa</th>
                                <th data-col="placa_carreta" scope="col" class="col-secundaria">Carreta</th>
                                <th data-col="motorista_nome" scope="col">Motorista</th>
                                <th data-col="vinculo" scope="col" class="col-secundaria">Vínculo</th>
                                <th data-col="status_operacional" scope="col">Status operacional</th>
                                <th data-col="macro_vigente" scope="col" class="col-secundaria">Macro</th>
                                <th data-col="velocidade" scope="col" class="num">km/h</th>
                                <th data-col="cidade_uf" scope="col">Cidade/UF</th>
                                <th data-col="localizacao_atual" scope="col" class="col-secundaria">Localização</th>
                                <th data-col="destino_nome" scope="col">Origem → Destino</th>
                                <th data-col="eta" scope="col">ETA destino</th>
                                <th data-col="minutos_sem_posicao" scope="col">Última posição</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo"></tbody>
                    </table>
                    <p id="tabela-vazia" class="tabela-vazia" hidden>Nenhum veículo com esses filtros.</p>
                </div>
            </div>
        </section>
    </main>

    <noscript><p class="aviso">Ative o JavaScript para usar o painel.</p></noscript>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
            integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
            integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr"
            crossorigin="anonymous"></script>
    <script src="../JavaScript/supabase-client.js"></script>
    <script src="../JavaScript/painel.js"></script>
</body>
</html>
